version: '3.8'

services:
  # ========== NGINX ==========
  nginx:
    image: nginx:alpine
    container_name: music-nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/var/www/frontend:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - frontend
    networks:
      - music-network

  # ========== API GATEWAY (Laravel) ==========
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: music-api-gateway
    ports:
      - "8001:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8001
      - USER_SERVICE_URL=http://user-service:3000
      - MUSIC_SERVICE_URL=http://music-service:80
    volumes:
      - ./backend/api-gateway:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - mongodb
      - user-service
      - music-service
    networks:
      - music-network

  # ========== USER SERVICE (Express.js) ==========
  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    container_name: music-user-service
    ports:
      - "8002:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://root:${MONGO_ROOT_PASSWORD}@mongodb:27017/users_db?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE}
      - JWT_ACCESS_EXPIRE=${JWT_ACCESS_EXPIRE}
    volumes:
      - ./shared:/app/shared
      - ./backend/user-service:/app/backend/user-service
      - /app/backend/user-service/node_modules
    depends_on:
      - mongodb
    networks:
      - music-network

  # ========== MUSIC SERVICE (Laravel) ==========
  music-service:
    build:
      context: ./backend/music-service
      dockerfile: Dockerfile
    container_name: music-music-service
    ports:
      - "8003:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8003
      - DB_CONNECTION=mongodb
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=music_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    volumes:
      - ./backend/music-service:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - mongodb
    networks:
      - music-network

  # ========== REACT FRONTEND ==========
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: music-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./shared:/app/shared
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    networks:
      - music-network

  # ========== MONGODB ==========
  mongodb:
    image: mongo:6.0
    container_name: music-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    networks:
      - music-network

  # ========== MONGO-EXPRESS (WEB-interface) ==========
  mongo-express:
    image: mongo-express:latest
    container_name: music-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD}
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=localuser
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - music-network

  # ========== REDIS ==========
  redis:
    image: redis:alpine
    container_name: music-redis
    ports:
      - "6379:6379"
    networks:
      - music-network

networks:
  music-network:
    driver: bridge

volumes:
  mongodb-data:
  frontend_node_modules: