version: '3.8'

services:
  # ========== NGINX (Обратный прокси) ==========
  nginx:
    image: nginx:alpine
    container_name: music-nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/var/www/frontend:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - frontend
    networks:
      - music-network

  # ========== API GATEWAY (Laravel) ==========
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: music-api-gateway
    ports:
      - "8001:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8001
      - USER_SERVICE_URL=http://user-service:3000
      - MUSIC_SERVICE_URL=http://music-service:80
      - DB_CONNECTION=mongodb
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=gateway_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    volumes:
      - ./backend/api-gateway:/var/www/html
    depends_on:
      - mongodb
      - user-service
      - music-service
    networks:
      - music-network

  # ========== USER SERVICE (Express.js) ==========
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: music-user-service
    ports:
      - "8002:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://root:root@mongodb:27017/users_db?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key
      - JWT_EXPIRE=7d
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - music-network

  # ========== MUSIC SERVICE (Laravel) ==========
  music-service:
    build:
      context: ./backend/music-service
      dockerfile: Dockerfile
    container_name: music-music-service
    ports:
      - "8003:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8003
      - DB_CONNECTION=mongodb
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=music_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    volumes:
      - ./backend/music-service:/var/www/html
    depends_on:
      - mongodb
    networks:
      - music-network

  # ========== REACT FRONTEND ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: music-frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - music-network

  # ========== MONGODB ==========
  mongodb:
    image: mongo:6.0
    container_name: music-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    volumes:
      - mongodb-data:/data/db
    networks:
      - music-network

  # ========== MONGO-EXPRESS (Веб-интерфейс для MongoDB) ==========
  mongo-express:
    image: mongo-express:latest
    container_name: music-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=root
      - ME_CONFIG_MONGODB_SERVER=mongodb
    depends_on:
      - mongodb
    networks:
      - music-network

  # ========== REDIS (Кэш) ==========
  redis:
    image: redis:alpine
    container_name: music-redis
    ports:
      - "6379:6379"
    networks:
      - music-network

networks:
  music-network:
    driver: bridge

volumes:
  mongodb-data: