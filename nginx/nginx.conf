server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # =============================================
    # 1. РАЗДАЧА ФРОНТЕНДА (React)
    # =============================================
    # Все запросы, которые не начинаются с /api/, идут на фронтенд
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }

 #   location / {
 #       proxy_pass http://frontend:5173; # Или 3000, смотрите порт в Vite
 #       proxy_set_header Host $host;
 #       proxy_set_header X-Real-IP $remote_addr;
 #       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 #       proxy_set_header X-Forwarded-Proto $scheme;
 #       proxy_http_version 1.1;
 #       proxy_set_header Upgrade $http_upgrade;
 #       proxy_set_header Connection "upgrade";
 #   }

    # =============================================
    # 2. ПРОКСИРОВАНИЕ ЗАПРОСОВ К API
    # =============================================
    # Все запросы, начинающиеся с /api/, перенаправляются на API Gateway
    location /api/ {
        proxy_pass http://api-gateway:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =============================================
    # 3. ПРЯМОЙ ДОСТУП К СЕРВИСАМ (ДЛЯ ОТЛАДКИ)
    # =============================================
    # Эти маршруты позволяют обращаться к сервисам напрямую, минуя Gateway
    # Используйте их только для тестирования!

    # Прямой доступ к User Service
    location /user-api/ {
        rewrite ^/user-api/(.*) /$1 break;
        proxy_pass http://user-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Прямой доступ к Music Service
    location /music-api/ {
        rewrite ^/music-api/(.*) /$1 break;
        proxy_pass http://music-service:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}